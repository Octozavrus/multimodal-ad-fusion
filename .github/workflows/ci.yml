name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint and data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: No imaging data, manifests or ADNI subject IDs in the repository
        run: python scripts/check_no_data.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url "$TORCH_INDEX"
      - name: Install package with training and development extras
        run: pip install -e ".[train,dev]"
      - name: Run tests with coverage
        run: >-
          pytest --cov=adfusion --cov-report=term --cov-report=xml
          --junitxml=junit.xml --cov-fail-under=85
      - name: Upload test reports
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  smoke:
    name: End-to-end smoke run (synthetic data)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url "$TORCH_INDEX"
      - run: pip install ".[train]"
      - name: Generate synthetic raw scans
        run: adfusion synth --out demo/raw --n 6
      - name: Preprocess (co-registration, crop, resampling, normalisation)
        run: adfusion preprocess --raw demo/raw --labels demo/raw/labels.csv --out demo/cache --shape 48
      - name: Registration quality gate
        run: adfusion qc demo/cache/cache_manifest.csv --threshold 0.5 --strict
      - name: Generate synthetic cohort
        run: adfusion synth-cohort --out demo/cohort --n 30 --shape 32
      - name: Nested cross-validation (smoke protocol)
        run: adfusion train --manifest demo/cohort/cache_manifest.csv --out demo/results --config configs/smoke.json
      - name: Figures
        run: adfusion figures demo/results --dpi 120
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            demo/cache/*.csv
            demo/cache/*.json
            demo/results/*.csv
            demo/results/*.json
            demo/results/*.png

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime --build-arg VCS_REF=${GITHUB_SHA::7} -t adfusion:ci .
      - name: Run the image on synthetic data
        run: |
          docker run --rm adfusion:ci --version
          docker run --rm adfusion:ci info
          docker run --rm --entrypoint sh adfusion:ci -c "set -e
            adfusion synth --out /tmp/raw --n 2
            adfusion preprocess --raw /tmp/raw --labels /tmp/raw/labels.csv --out /tmp/cache --shape 32
            adfusion synth-cohort --out /tmp/cohort --n 24 --shape 16
            adfusion train --manifest /tmp/cohort/cache_manifest.csv --out /tmp/results --config /app/configs/smoke.json --models pet --no-checkpoints"

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/adfusion --version
          /tmp/venv/bin/adfusion synth --out /tmp/raw --n 2
          /tmp/venv/bin/adfusion preprocess --raw /tmp/raw --labels /tmp/raw/labels.csv --out /tmp/cache --shape 32
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
