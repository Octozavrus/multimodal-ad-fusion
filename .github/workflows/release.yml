name: Release

# Continuous delivery: pushing a version tag (for example v1.0.0) re-runs the
# tests, builds the sdist and wheel, and publishes them as a GitHub Release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check that the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION}"
            exit 1
          fi

      - name: Test
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
          python scripts/check_no_data.py
          pytest -q

      - name: Build
        run: |
          python -m build
          twine check dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "adfusion $GITHUB_REF_NAME"
          --notes-file CHANGELOG.md
          --verify-tag
